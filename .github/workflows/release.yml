name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Check release version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content cmd/desktop/version.txt -Raw).Trim()
          if ($tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag must have the form vX.Y.Z: $tag"
          }
          if ($tag -cne "v$version") {
            throw "Release tag $tag does not match cmd/desktop/version.txt ($version)"
          }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cmd/desktop/frontend/package-lock.json

      - name: Generate desktop bindings
        run: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.26 generate bindings -d cmd/desktop/frontend/bindings -clean=true -ts -i ./cmd/desktop

      - name: Build desktop frontend
        run: |
          npm ci --prefix cmd/desktop/frontend
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run build --prefix cmd/desktop/frontend
          if ($LASTEXITCODE -ne 0) { throw 'frontend build failed' }

      - name: Build Windows desktop client
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -tags production -trimpath -ldflags="-w -s -H windowsgui" -o dist/Govts-windows-amd64.exe ./cmd/desktop
          if ($LASTEXITCODE -ne 0) { throw 'desktop build failed' }

      - name: Build Linux server
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-w -s" -o dist/govts-server-linux-amd64 ./cmd/server
          if ($LASTEXITCODE -ne 0) { throw 'server build failed' }

      - name: Sign desktop update
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $version = (Get-Content cmd/desktop/version.txt -Raw).Trim()
          go run ./cmd/update-sign -binary dist/Govts-windows-amd64.exe -version $version -public-key cmd/desktop/update-public-key.txt -out dist/govts-update.json
          if ($LASTEXITCODE -ne 0) { throw 'update signing failed' }
          $hash = (Get-FileHash -Algorithm SHA256 dist/Govts-windows-amd64.exe).Hash.ToLowerInvariant()
          "$hash  Govts-windows-amd64.exe" | Set-Content -Encoding ascii dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $draft = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw "Release $tag is already published" }
          } else {
            gh release create $tag --draft --generate-notes --verify-tag
            if ($LASTEXITCODE -ne 0) { throw 'release creation failed' }
          }
          gh release upload $tag dist/Govts-windows-amd64.exe dist/govts-server-linux-amd64 dist/govts-update.json dist/SHA256SUMS --clobber
          if ($LASTEXITCODE -ne 0) { throw 'release asset upload failed' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'release publication failed' }
