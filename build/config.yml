version: '3'

info:
  companyName: "Govots"
  productName: "Govots"
  productIdentifier: "app.govots.desktop"
  description: "Голосовой desktop-клиент Govots"
  copyright: "(c) 2026 Govots contributors"
  version: "0.1.27"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 700
  ignore:
    dir:
      - .git
      - .idea
      - node_modules
      - cmd/desktop/frontend
      - bin
    file:
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.20 task frontend:dev
      type: background
    - cmd: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.20 task build:dev
      type: blocking
    - cmd: go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.20 task run:dev
      type: primary

fileAssociations: []
